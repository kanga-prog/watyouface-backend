# Development-only profile: in-memory database and no external mail service.
spring.datasource.url=${DB_URL:jdbc:h2:mem:watyouface;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mail.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.security.hsts.enabled=false
app.security.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
app.security.jwt.allow-bearer-fallback=true
server.error.include-message=never
server.port=8081
