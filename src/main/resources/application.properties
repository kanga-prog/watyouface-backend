spring.application.name=WatYouFace Backend

# Secrets are supplied by the deployment environment. The application fails fast
# when JWT_SECRET is absent or shorter than 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.hsts.enabled=${HSTS_ENABLED:false}
app.security.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.step-up.challenge-ttl-seconds=${STEP_UP_CHALLENGE_TTL_SECONDS:300}
app.security.step-up.max-code-attempts=${STEP_UP_MAX_CODE_ATTEMPTS:5}
app.security.step-up.request-limit=${STEP_UP_REQUEST_LIMIT:3}
app.security.step-up.request-window-seconds=${STEP_UP_REQUEST_WINDOW_SECONDS:900}
app.security.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
app.security.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.security.jwt.allow-bearer-fallback=false

logging.level.root=INFO
logging.level.org.springframework.web=INFO
server.error.include-message=never
spring.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
spring.mail.default-encoding=UTF-8
