spring.application.name=WatYouFace Backend

# Secrets are supplied by the deployment environment. The application fails fast
# when JWT_SECRET is absent or shorter than 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.hsts.enabled=${HSTS_ENABLED:false}
app.security.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
app.security.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.security.jwt.allow-bearer-fallback=false

logging.level.root=INFO
logging.level.org.springframework.web=INFO
server.error.include-message=never
