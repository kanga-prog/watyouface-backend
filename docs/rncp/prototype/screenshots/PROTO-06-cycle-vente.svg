<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Capture représentative du cycle de vente simulé"><style>.b{fill:#f5f7fb}.p{fill:#2156a5}.ok{fill:#157a4a}.wait{fill:#8a5a00}.t{fill:#172033;font:20px system-ui}.s{fill:#526070;font:14px system-ui}.w{fill:#fff;font:16px system-ui}</style><rect class="b" width="1200" height="450"/><text x="55" y="70" class="t">Cycle de vente — simulation prototype</text><g transform="translate(55 160)"><rect width="130" height="56" rx="28" class="p"/><text x="23" y="35" class="w">AVAILABLE</text><text x="145" y="35" class="t">→</text><rect x="175" width="130" height="56" rx="28" fill="#fff4d6" stroke="#8a5a00"/><text x="205" y="35" class="s">PENDING</text><text x="320" y="35" class="t">→</text><rect x="350" width="140" height="56" rx="28" class="p"/><text x="373" y="35" class="w">ACCEPTED</text><text x="505" y="35" class="t">→</text><rect x="535" width="100" height="56" rx="28" class="ok"/><text x="567" y="35" class="w">PAID</text><text x="650" y="35" class="t">→</text><rect x="680" width="120" height="56" rx="28" fill="#5b47b7"/><text x="704" y="35" class="w">SHIPPED</text><text x="815" y="35" class="t">→</text><rect x="845" width="130" height="56" rx="28" class="ok"/><text x="868" y="35" class="w">RECEIVED</text></g><rect x="55" y="280" width="470" height="80" rx="10" fill="#e9effa" stroke="#2156a5"/><text x="78" y="315" class="t">Wallet de démonstration</text><text x="78" y="343" class="s">100 crédits démo → paiement 30 → 70 crédits démo</text><text x="55" y="405" class="s">Les transitions sont locales et ne déclenchent aucune transaction réelle.</text></svg>
